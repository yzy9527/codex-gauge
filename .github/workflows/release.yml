name: Release macOS app

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build ad-hoc signed DMG
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-release.sh "${VERSION}"

      - name: Verify DMG image
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          hdiutil verify "dist/CodexGauge-${VERSION}-arm64.dmg"

      - name: Attest DMG build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: dist/CodexGauge-*-arm64.dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            > [!IMPORTANT]
            > 此版本使用 ad-hoc 签名且未经 Apple 公证。首次启动被 macOS 拦截时，请前往“系统设置 → 隐私与安全性”，点击“仍要打开”。

            仅支持 Apple Silicon，最低要求 macOS 14。
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/CodexGauge-${VERSION}-arm64.dmg" \
            "dist/CodexGauge-${VERSION}-arm64.dmg.sha256" \
            --verify-tag \
            --generate-notes \
            --notes "${RELEASE_NOTES}" \
            --title "Codex Gauge ${GITHUB_REF_NAME}"
